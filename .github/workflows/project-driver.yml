name: project-driver

on:
  workflow_dispatch:
    inputs:
      task:
        description: Project driver task
        required: false

  issues:
    types: [opened]

  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  run-agent:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r agents/project_driver/requirements.txt

      - name: Run Project Driver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          PROJECT_DRIVER_MODE: ${{ github.event.pull_request.number && 'pr-review' || 'planning' }}
          PROJECT_DRIVER_TASK: ${{ github.event.pull_request.title || github.event.inputs.task || github.event.issue.title }}
        run: |
          python agents/project_driver/agent.py
