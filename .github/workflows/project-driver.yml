name: project-driver

on:
  workflow_dispatch:
    inputs:
      task:
        description: Project driver task
        required: false

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r agents/project_driver/requirements.txt

      - name: Run Project Driver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROJECT_DRIVER_TASK: ${{ github.event.inputs.task }}
        run: |
          python agents/project_driver/agent.py
